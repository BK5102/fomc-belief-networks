# run the R unit tests on every push and pull request
# the regression test skips itself because the raw Kalshi data is not in the repository
name: R tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: track2_pipeline
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::stringr
            any::readr
            any::tibble
            any::igraph
            any::testthat
      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
